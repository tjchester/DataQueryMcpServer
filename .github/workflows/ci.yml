name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DataQueryMcpServer.slnx

      - name: Build
        run: dotnet build DataQueryMcpServer.slnx --no-restore --configuration Release

      - name: Test (excludes tests that require a live SQL Server instance)
        run: >
          dotnet test tests/DataQueryMcpServer.Tests/DataQueryMcpServer.Tests.csproj
          --no-build --configuration Release
          --filter "Category!=RequiresLocalSqlServer"
